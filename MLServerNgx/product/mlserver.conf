
# lua_package_path '/mlserver/lua/?.lua;;';
# lua_package_cpath '/mlserver/lua_so/?.so;;';

# Turn it on in production environment
# lua_code_cache off;

resolver 8.8.8.8;

ml_conf_dir "/mlserver";
ml_lyrics_dir "/mlserver/lyrics";
ml_related_upload_dir "lu7";
ml_base_http_link "http://search.crintsoft.com/l/";

log_format  main  '$remote_addr "$time_local" "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

access_log  /mlserver/log/access.log  main;

# error_log /mlserver/log/error.log crit;
error_log /mlserver/log/error.log info;

lua_package_path '/mlserver/lua/?.lua;;';
lua_package_cpath '/mlserver/lua_so/?.so;;';

# Turn it on in production environment
lua_code_cache off;
#lua_code_cache on;

server {
    listen 80;
    server_name search.crintsoft.com;

    access_log  /mlserver/log/access.log  main buffer=32k;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        # root   "/mlserver/html";
        # echo "Internal server error."
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location = / {
        default_type 'text/html;charset=utf-8';

        content_by_lua_block {
            local response = "Service's online."
            ngx.say(response)
        }
    }

    location /searchlyrics.htm {
        mlserver on;
    }
    
    location /s {
        mlserver_stub on;
    }

    location /l/ {
        alias "/mlserver/lyrics/";
        index  index.html index.htm;
    }

    location /analytics {
        access_by_lua_block {
            local response = "Result=OK"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name viewlyrics.com www.viewlyrics.com;

    ssl_certificate /etc/letsencrypt/live/crintsoft.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crintsoft.com/privkey.pem; # managed by Certbot

    include "/etc/letsencrypt/options-ssl-nginx.conf";

    # Redirect non-https traffic to https
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    access_log  /mlserver/log/viewlyrics_access.log  main buffer=32k;
    # error_log /mlserver/log/vl_error.log crit;
    # error_log /mlserver/log/vl_error.log info;

    # lua_need_request_body on;

    set $template_root "/mlserver/template_viewlyrics/";

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    error_page   400 404  /40x.html;
    location = /40x.html {
        access_by_lua_block {
            local response = "404 NOT Found"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location / {
        default_type 'text/html;charset=utf-8';

        content_by_lua_file "/mlserver/lua/viewlyricsMain.lua";
    }

    location /static/ {
        alias /mlserver/static/;
    }

    # Support https://certbot.eff.org/lets-encrypt/ubuntubionic-other
    location /.well-known {
        alias /mlserver/ml/.well-known;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name crintsoft.com www.crintsoft.com minilyrics.com www.minilyrics.com;

    ssl_certificate /etc/letsencrypt/live/crintsoft.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crintsoft.com/privkey.pem; # managed by Certbot

    include "/etc/letsencrypt/options-ssl-nginx.conf";

    # Redirect non-https traffic to https
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    access_log  /mlserver/log/crintsoft_access.log  main buffer=32k;

    set $template_root "/mlserver/crintsoft.com/";

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        access_by_lua_block {
            local response = "Internal server error"
            ngx.header.Content_Length = string.len(response)
            ngx.say(response)
        }
    }

    location / {
        default_type 'text/html;charset=utf-8';
        content_by_lua_file "/mlserver/lua/crintsoftMain.lua";
    }

    location /static/ {
        alias /mlserver/crintsoft.com/static/;
    }

    location /download/ {
        alias /mlserver/crintsoft.com/download/;
    }

    # Support https://certbot.eff.org/lets-encrypt/ubuntubionic-other
    location /.well-known {
        alias /mlserver/ml/.well-known;
    }
}
